# @format

name: 07- Contexts
run-name: using context on ${{ runner.os }}
on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false
jobs:
  echo-data:
    env:
      MY_JOB_VAR: "job"
      MY_OVERWRITTEN_VAR: "job"
    runs-on: ubuntu-latest
    steps:
      - name: display_informa
        run: |
          echo "EventName: ${{github.event_name}}"
          echo "RefName: ${{github.ref}}"
          echo "Sha: ${{github.sha}}"
          echo "Actor ${{github.actor}}"
          echo "Workflow ${{github.workflow}}"
          echo "RunnerNumber: ${{github.run_number}}"
          echo "RunID: ${{github.run_id}}"
          echo "fristEnv : ${{env.MY_JOB_VAR}}"
          echo "secondEnv ${{env.MY_OVERWRITTEN_VAR}}"
          echo "----------- vars from repo --------------"
          echo "my frist name ${{ vars.MY_FIRST_NAME}}"
          echo "my second name ${{ vars.MY_SECOND_NAME}}"
