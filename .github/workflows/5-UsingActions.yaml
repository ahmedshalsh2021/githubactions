# @format

name: 05-using-actions
on:
  workflow_dispatch:

jobs:
  using-actions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 5-UsingActions/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26.x"

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
