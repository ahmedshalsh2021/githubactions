# @format

name: 5-using-actions
on:
  workflow_dispatch:
jobs:
  using-actions:
    defaults:
      run:
        working-directory: 5-UsingActions/react-app
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v7
      
      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: "24-x"
      - name: install-dependancies
        
        run: npm ci
      - name: start app
        
        run: npm start
